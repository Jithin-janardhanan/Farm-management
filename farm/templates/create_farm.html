<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farm Management</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin-bottom: 20px; }
        .valve { margin: 5px; }
        button { padding: 5px 10px; cursor: pointer; }
        #farm-data, #farm-list { border: 1px solid #ccc; padding: 10px; }
        .motor-input { margin: 10px 0; padding: 10px; border: 1px solid #eee; }
        pre { background: #f4f4f4; padding: 10px; border-radius: 5px; }
        .error { color: red; }
        .farm-item, .motor-item { margin: 10px 0; }
    </style>
</head>
<body>
    <h1>Farm Management System</h1>

    <div class="section">
        <h2>Create/Edit Farm</h2>
        <input type="hidden" id="farm-edit-id">
        <input type="text" id="farm-name" placeholder="Farm Name">
        <input type="text" id="farm-location" placeholder="Location">
        <select id="farm-owner">
            <option value="">Select Owner</option>
        </select>
        <div id="owner-error" class="error"></div>

        <div id="motors-container">
            <h3>Motors</h3>
            <div id="motor-inputs"></div>
            <button type="button" onclick="addMotorInput()">Add Motor</button>
        </div>

        <button onclick="saveFarm()">Save Farm</button>
    </div>

    <div class="section">
        <h2>Farm List</h2>
        <button onclick="listFarms()">Refresh Farm List</button>
        <div id="farm-list"></div>
    </div>

    <div class="section">
        <h2>Farm Data</h2>
        <input type="number" id="farm-id" placeholder="Farm ID">
        <button onclick="getFarmData()">Get Farm Data</button>
        <div id="farm-data"></div>
    </div>

    <script>
        const API_BASE_URL = 'http://127.0.0.1:8000/farm/';

        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }

        $.ajaxSetup({
            beforeSend: function(xhr, settings) {
                if (!/^(GET|HEAD|OPTIONS|TRACE)$/i.test(settings.type) && !this.crossDomain) {
                    xhr.setRequestHeader("X-CSRFToken", getCookie('csrftoken'));
                }
            }
        });

        $(document).ready(function() {
            $.ajax({
                url: `http://127.0.0.1:8000/users/`,
                method: 'GET',
                success: function(users) {
                    const ownerSelect = $('#farm-owner');
                    if (!users || users.length === 0) {
                        $('#owner-error').text('No users found');
                        return;
                    }
                    users.forEach(user => {
                        ownerSelect.append(
                            `<option value="${user.id}">${user.email} (${user.role})</option>`
                        );
                    });
                    $('#owner-error').text('');
                },
                error: function(xhr) {
                    $('#owner-error').text(`Failed to load owners: ${xhr.status} - ${xhr.statusText}`);
                }
            });
            addMotorInput();
            listFarms();
        });

        let motorCount = 0;

        function addMotorInput(motor = null) {
            motorCount++;
            const motorHtml = `
                <div class="motor-input" id="motor-${motorCount}">
                    <input type="hidden" id="motor-id-${motorCount}" value="${motor?.id || ''}">
                    <select id="motor-type-${motorCount}">
                        <option value="single_phase" ${motor?.motor_type === 'single_phase' ? 'selected' : ''}>Single Phase</option>
                        <option value="double_phase" ${motor?.motor_type === 'double_phase' ? 'selected' : ''}>Double Phase</option>
                        <option value="triple_phase" ${motor?.motor_type === 'triple_phase' ? 'selected' : ''}>Triple Phase</option>
                    </select>
                    <input type="number" id="valve-count-${motorCount}" placeholder="Valve Count" min="1" required value="${motor?.valve_count || ''}">
                    <button type="button" onclick="$('#motor-${motorCount}').remove()">Remove</button>
                </div>
            `;
            $('#motor-inputs').append(motorHtml);
        }

        function saveFarm() {
            const farmId = $('#farm-edit-id').val();
            const motors = [];

            // Collect motor information from all motor input fields
            $('#motor-inputs .motor-input').each(function() {
                const motorTypeSelect = $(this).find('select[id^="motor-type-"]');
                const valveCountInput = $(this).find('input[id^="valve-count-"]');
                const motorIdInput = $(this).find('input[id^="motor-id-"]');

                const motorType = motorTypeSelect.val();
                const valveCount = parseInt(valveCountInput.val());
                const motorId = motorIdInput.val();

                // Validate valve count
                if (isNaN(valveCount) || valveCount < 1) {
                    alert(`Please enter a valid valve count for motor`);
                    return false;
                }

                motors.push({
                    id: motorId || undefined,  // Use undefined if no ID
                    motor_type: motorType,
                    valve_count: valveCount
                });
            });

            // Check if any motors were added
            if (motors.length === 0) {
                alert('Please add at least one motor');
                return;
            }

            const farmData = {
                name: $('#farm-name').val() || 'Unnamed Farm',
                location: $('#farm-location').val() || 'Unknown Location',
                owner: parseInt($('#farm-owner').val()),
                motors: motors
            };

            console.log('Sending farm data:', JSON.stringify(farmData, null, 2));

            const method = farmId ? 'PUT' : 'POST';
            const url = farmId ? `${API_BASE_URL}farms/${farmId}/` : `${API_BASE_URL}farms/`;

            $.ajax({
                url: url,
                method: method,
                contentType: 'application/json',
                data: JSON.stringify(farmData),
                success: function(response) {
                    console.log('Received response:', JSON.stringify(response, null, 2));
                    alert(`Farm ${farmId ? 'updated' : 'created'} with ID: ${response.id} and ${motors.length} motors`);
                    displayFarmData(response);
                    listFarms();
                    resetForm();
                },
                error: function(xhr) {
                    console.error('Error:', xhr.responseText);
                    $('#farm-data').html(`<pre>Error: ${xhr.responseText}</pre>`);
                    alert('Error saving farm: ' + xhr.responseText);
                }
            });
        }

        function resetForm() {
            $('#farm-edit-id').val('');
            $('#farm-name, #farm-location').val('');
            $('#farm-owner').val('');
            $('#motor-inputs').empty();
            motorCount = 0;
            addMotorInput();
        }

        function listFarms() {
            $.ajax({
                url: `${API_BASE_URL}farms/`,
                method: 'GET',
                success: function(farms) {
                    let html = '';
                    farms.forEach(farm => {
                        html += `
                            <div class="farm-item">
                                <h3>${farm.name} (ID: ${farm.id}) - ${farm.location}</h3>
                                <p>Owner ID: ${farm.owner}</p>
                                <button onclick="editFarm(${farm.id})">Edit</button>
                                <button onclick="deleteFarm(${farm.id})">Delete</button>
                                <div class="motor-list">
                                    <h4>Motors:</h4>
                                    ${farm.motors.map(motor => `
                                        <div class="motor-item">
                                            <p>Motor ${motor.id} (${motor.motor_type}) - ${motor.valve_count} valves</p>
                                            <button onclick="editMotor(${motor.id}, ${farm.id})">Edit</button>
                                            <button onclick="deleteMotor(${motor.id}, ${farm.id})">Delete</button>
                                            <div class="valve-list" style="margin-left: 20px;">
                                                ${motor.valves && motor.valves.length > 0 ?
                                                    motor.valves.map(valve => `
                                                        <div class="valve">
                                                            ${valve.name} (ID: ${valve.id}) - Status: ${valve.is_active ? 'Active' : 'Inactive'}
                                                            <button onclick="toggleValve(${valve.id}, ${valve.is_active})">Toggle</button>
                                                        </div>
                                                    `).join('') :
                                                    '<p>No valves assigned</p>'
                                                }
                                            </div>
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `;
                    });
                    $('#farm-list').html(html);
                },
                error: function(xhr) {
                    $('#farm-list').html(`<pre>Error: ${xhr.responseText}</pre>`);
                }
            });
        }

        function editFarm(farmId) {
            $.ajax({
                url: `${API_BASE_URL}farms/${farmId}/`,
                method: 'GET',
                success: function(farm) {
                    $('#farm-edit-id').val(farm.id);
                    $('#farm-name').val(farm.name);
                    $('#farm-location').val(farm.location);
                    $('#farm-owner').val(farm.owner);
                    $('#motor-inputs').empty();
                    motorCount = 0;
                    farm.motors.forEach(motor => addMotorInput(motor));
                },
                error: function(xhr) {
                    alert('Error loading farm: ' + xhr.responseText);
                }
            });
        }

        function deleteFarm(farmId) {
            if (confirm('Are you sure you want to delete this farm?')) {
                $.ajax({
                    url: `${API_BASE_URL}farms/${farmId}/`,
                    method: 'DELETE',
                    success: function() {
                        alert('Farm deleted');
                        listFarms();
                        resetForm();
                    },
                    error: function(xhr) {
                        alert('Error deleting farm: ' + xhr.responseText);
                    }
                });
            }
        }

        function editMotor(motorId, farmId) {
            $.ajax({
                url: `${API_BASE_URL}motors/${motorId}/`,
                method: 'GET',
                success: function(motor) {
                    editFarm(farmId);
                    setTimeout(() => {
                        for (let i = 1; i <= motorCount; i++) {
                            if ($(`#motor-id-${i}`).val() == motorId) {
                                $(`#motor-type-${i}`).val(motor.motor_type);
                                $(`#valve-count-${i}`).val(motor.valve_count);
                                break;
                            }
                        }
                    }, 100);
                },
                error: function(xhr) {
                    alert('Error loading motor: ' + xhr.responseText);
                }
            });
        }

        function deleteMotor(motorId, farmId) {
            if (confirm('Are you sure you want to delete this motor?')) {
                $.ajax({
                    url: `${API_BASE_URL}motors/${motorId}/`,
                    method: 'DELETE',
                    success: function() {
                        alert('Motor deleted');
                        listFarms();
                        if ($('#farm-edit-id').val() == farmId) {
                            editFarm(farmId);
                        }
                    },
                    error: function(xhr) {
                        alert('Error deleting motor: ' + xhr.responseText);
                    }
                });
            }
        }

        function getFarmData() {
            const farmId = $('#farm-id').val();
            if (!farmId) {
                $('#farm-data').html('<p>Please enter a Farm ID</p>');
                return;
            }
            $.ajax({
                url: `${API_BASE_URL}farms/${farmId}/`,
                method: 'GET',
                success: function(data) {
                    displayFarmData(data);
                },
                error: function(xhr) {
                    $('#farm-data').html(`<pre>Error: ${xhr.responseText}</pre>`);
                }
            });
        }

        function toggleValve(valveId, currentStatus) {
            const newStatus = currentStatus === 1 ? 0 : 1;
            // Find the valve element to get its current name
            const valveElement = $(`#farm-data .valve:contains('(ID: ${valveId})')`);
            const valveText = valveElement.text();
            const valveNameMatch = valveText.match(/^(.*)\s\(ID:/);
            const valveName = valveNameMatch ? valveNameMatch[1].trim() : `Valve ${valveId}`; // Fallback name if parsing fails

            $.ajax({
                url: `${API_BASE_URL}valves/${valveId}/`,
                method: 'PUT',
                contentType: 'application/json',
                data: JSON.stringify({
                    name: valveName,
                    is_active: newStatus
                }),
                success: function(response) {
                    console.log('Toggle response:', response);
                    getFarmData(); // Refresh the farm data
                    listFarms();   // Refresh the farm list as well
                },
                error: function(xhr) {
                    console.log('Toggle error:', xhr.responseText);
                    alert('Error toggling valve: ' + xhr.responseText);
                }
            });
        }

        function displayFarmData(data) {
            let html = `<h3>${data.name} - ${data.location}</h3>`;
            html += `<p>Owner ID: ${data.owner || 'Not assigned'}</p>`;

            html += `<h4>Raw Response:</h4>`;
            html += `<pre>${JSON.stringify(data, null, 2)}</pre>`;

            html += `<h4>Motors and Valves:</h4>`;
            if (data.motors && data.motors.length > 0) {
                data.motors.forEach(motor => {
                    html += `<div class="motor">`;
                    html += `<h4>Motor ${motor.id} (${motor.motor_type}) - ${motor.valve_count} valves</h4>`;
                    if (motor.valves && motor.valves.length > 0) {
                        motor.valves.forEach(valve => {
                            html += `<div class="valve">`;
                            html += `${valve.name} (ID: ${valve.id}) - Status: ${valve.is_active ? 'Active' : 'Inactive'}`;
                            html += ` <button onclick="toggleValve(${valve.id}, ${valve.is_active})">Toggle</button>`;
                            html += `</div>`;
                        });
                    } else {
                        html += `<p>No valves assigned yet</p>`;
                    }
                    html += `</div>`;
                });
            } else {
                html += `<p>No motors assigned to this farm</p>`;
            }

            $('#farm-data').html(html);
        }
    </script>
</body>
</html>
